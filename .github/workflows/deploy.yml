name: Deploy mehanonline.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mehanonline-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:static

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::120358397452:role/github-actions-mehanonline-deploy
          aws-region: us-east-1

      - name: Publish to S3
        run: aws s3 sync out/ s3://mehanonline-com-site --delete --only-show-errors

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2YSZGYD73SEVD --paths '/*'
